<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Report Trash — ZeroWasteWay</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/report-trash.css">
</head>

<body>

  <header>
    <div class="brand">🌱 ZeroWasteWay</div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="trash-tips.html">Trash Tips</a>
      <a href="plastic-management.html">Plastic Management</a>
      <a href="rewards.html">Rewards</a>
      <a href="report-trash.html">Report Trash</a>
      <a href="buy-recycled.html">Buy Recycled</a>
      <a href="recycle-centers.html">Recycle</a>
      <a href="sustainable-products.html">Sustainable Products</a>
    </nav>
  </header>


  <main class="wrap">

    <section class="card">

      <h1>📸 Report Trash</h1>

      <p>
        Found illegal dumping or overflowing waste?
        Report it to help keep your community clean.
      </p>


      <form id="trashReportForm" enctype="multipart/form-data">

        <!-- ========================= -->
        <!-- UPLOAD PHOTO -->
        <!-- ========================= -->

        <div class="row">

          <label for="trashPhoto">
            Upload Photo
          </label>

          <input
            type="file"
            id="trashPhoto"
            name="before_photo"
            accept="image/*"
            required
          >

        </div>


        <!-- ========================= -->
        <!-- LOCATION -->
        <!-- ========================= -->

        <div class="row">

          <label for="locationInput">
            Location
          </label>

          <input
            type="text"
            id="locationInput"
            name="location"
            placeholder="Search for a location..."
            autocomplete="off"
            required
          >

          <!--
            Autocomplete suggestions will be
            inserted here by report-trash.js
          -->

          <div id="locationSuggestions"></div>

        </div>


        <!-- ========================= -->
        <!-- DESCRIPTION -->
        <!-- ========================= -->

        <div class="row">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            name="description"
            placeholder="Describe the problem..."
            rows="5"
            required
          ></textarea>

        </div>


        <!-- ========================= -->
        <!-- SUBMIT -->
        <!-- ========================= -->

        <button
          class="btn"
          type="submit"
        >
          Submit Report
        </button>

      </form>

    </section>

  </main>


  <footer>
    © 2026 ZeroWasteWay
  </footer>


  <script src="../js/report-trash.js"></script>

</body>

</html>
