<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sign Up — ZeroWasteWay</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

  <main class="auth">

    <div class="auth-card">

      <div class="auth-hero">

        <span class="chip">🌱 ZeroWasteWay</span>

        <h1>Start your green journey</h1>

        <p>
          Create your account and become part of a community
          working towards a cleaner planet.
        </p>

        <div class="points">
          <span class="chip">♻ Plastic Management</span>
          <span class="chip">🏅 Earn Green Rewards</span>
          <span class="chip">🛒 Shop Sustainably</span>
        </div>

      </div>

      <div class="auth-forms">

        <div class="tabs">
          <a class="tab" href="login.html">Login</a>
          <a class="tab active" href="signup.html">Sign Up</a>
        </div>

        <form id="signupForm">

          <div class="row">
            <label class="muted">Full Name</label>
            <input required name="fullname">
          </div>

          <div class="row">
            <label class="muted">Email</label>
            <input required name="email" type="email">
          </div>

          <div class="row">
            <label class="muted">Password</label>
            <input
              required
              name="newpass"
              type="password"
              minlength="8"
            >
          </div>

          <button class="btn" type="submit">
            Create Account
          </button>

        </form>

      </div>
    </div>

  </main>

  <script src="../js/auth.js"></script>

</body>
</html>
